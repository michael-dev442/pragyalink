<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Passenger Radar | PragyaLink Ghana</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
            background-color: #0f172a;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .maplibregl-popup-content {
            background: #0f172a !important;
            color: #f8fafc !important;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 14px;
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #0f172a !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-3 flex justify-between items-center z-20 shadow-xl shrink-0">
        <div class="flex items-center space-x-2">
            <a href="/" class="text-xl font-black text-white">Pragya<span class="text-emerald-400">Link 🇬🇭</span></a>
            <span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-2 py-0.5 rounded-full border border-emerald-500/30 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 3D Ultra-Detail Radar
            </span>
        </div>
        
        <div class="flex items-center space-x-2">
            <select id="radiusSelect" onchange="updateRadius(this.value)" class="bg-slate-800 text-xs font-bold text-sky-300 border border-slate-700 px-2.5 py-1.5 rounded-lg focus:outline-none">
                <option value="2">2 km</option>
                <option value="3" selected>3 km</option>
                <option value="5">5 km</option>
            </select>
            <a href="/rider" class="text-xs bg-emerald-500 text-slate-950 font-black px-3 py-1.5 rounded-lg hover:bg-emerald-400 transition">
                Driver Console
            </a>
        </div>
    </header>

    <div class="flex-1 relative flex flex-col md:flex-row min-h-0 w-full">
        
        <div class="flex-1 relative h-full w-full">
            <div id="map"></div>
        </div>

        <aside class="w-full md:w-96 glass-panel border-t md:border-t-0 md:border-l border-slate-800 p-4 flex flex-col z-10 shadow-2xl max-h-[40vh] md:max-h-full overflow-y-auto shrink-0">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div>
                    <h2 class="text-sm sm:text-base font-black text-white">Active Drivers</h2>
                    <p class="text-[10px] text-slate-400">Nearby Pragya & Bajaj riders</p>
                </div>
                <span id="activeCount" class="bg-emerald-500/20 text-emerald-400 text-xs font-mono font-bold px-2.5 py-1 rounded-full border border-emerald-500/30">
                    0 Nearby
                </span>
            </div>

            <div id="riderList" class="space-y-3 flex-1 overflow-y-auto">
                <div id="emptyMsg" class="text-xs text-slate-400 text-center py-8">
                    Scanning area for active drivers...
                </div>
            </div>
        </aside>
    </div>

    <script>
        const socket = io();
        const markers = {};
        let passengerPos = { lat: 6.6885, lng: -1.6244 }; // Default Kumasi/Nkawie fallback
        let maxRadiusKm = 3;

        // Initialize MapLibre with High-Detail Vector Tiles & 3D Pitch
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json', // High-detail Carto Voyager 3D Vector Style
            center: [passengerPos.lng, passengerPos.lat],
            zoom: 16.5,
            pitch: 55,       // 3D Perspective Tilt
            bearing: -17.6,  // Dynamic 3D Camera Angle
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

        // Enable 3D Buildings Layer once map loads
        map.on('load', () => {
            map.resize();

            // Insert 3D Building Extrusions
            const layers = map.getStyle().layers;
            let labelLayerId;
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
                    labelLayerId = layers[i].id;
                    break;
                }
            }

            if (!map.getLayer('3d-buildings')) {
                map.addLayer(
                    {
                        'id': '3d-buildings',
                        'source': 'carto',
                        'source-layer': 'building',
                        'type': 'fill-extrusion',
                        'minzoom': 14,
                        'paint': {
                            'fill-extrusion-color': '#1e293b',
                            'fill-extrusion-height': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                14, 0,
                                15.05, ['get', 'render_height']
                            ],
                            'fill-extrusion-base': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                14, 0,
                                15.05, ['get', 'render_min_height']
                            ],
                            'fill-extrusion-opacity': 0.75
                        }
                    },
                    labelLayerId
                );
            }
        });

        window.addEventListener('resize', () => map.resize());

        // GPS Auto-Detection
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                passengerPos.lat = pos.coords.latitude;
                passengerPos.lng = pos.coords.longitude;
                
                map.flyTo({ center: [passengerPos.lng, passengerPos.lat], zoom: 16.5, pitch: 55 });
                map.resize();

                const pEl = document.createElement('div');
                pEl.className = 'w-4 h-4 bg-sky-500 rounded-full border-2 border-white shadow-lg animate-ping';
                new maplibregl.Marker({ element: pEl })
                    .setLngLat([passengerPos.lng, passengerPos.lat])
                    .addTo(map);
            });
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function updateRadius(val) {
            maxRadiusKm = parseFloat(val);
            renderFilteredRiders();
        }

        socket.on('current-riders', (riders) => riders.forEach(updateOrAddRider));
        socket.on('rider-location-updated', (rider) => updateOrAddRider(rider));
        socket.on('rider-disconnected', (socketId) => {
            if (markers[socketId]) {
                markers[socketId].marker.remove();
                delete markers[socketId];
                renderFilteredRiders();
            }
        });

        function updateOrAddRider(rider) {
            const { socketId, username, fullName, contact, vehicleType, vehicleColor, plateNumber, lat, lng } = rider;
            const distKm = calculateDistanceKm(passengerPos.lat, passengerPos.lng, lat, lng);
            const estFare = (5 + (distKm * 2.5)).toFixed(2);

            const popupHTML = `
                <div class="space-y-1.5 text-xs">
                    <div class="flex justify-between items-center gap-2">
                        <span class="font-extrabold text-emerald-400 text-sm">🛺 ${vehicleType || 'Bajaj RE'}</span>
                        <span class="bg-emerald-500/20 text-emerald-300 font-mono font-bold text-[10px] px-2 py-0.5 rounded border border-emerald-500/30">
                            ${distKm < 1 ? Math.round(distKm * 1000) + 'm away' : distKm.toFixed(1) + 'km away'}
                        </span>
                    </div>
                    <div class="text-white font-bold text-sm">${fullName || username}</div>
                    <div class="text-slate-300">📞 <a href="tel:${contact}" class="underline text-sky-300 font-bold">${contact || 'N/A'}</a></div>
                    <div class="text-slate-400">Plate: <span class="text-amber-400 font-mono font-bold">${plateNumber || 'N/A'}</span></div>
                    <div class="text-emerald-400 font-bold">Est. Fare: GH₵ ${estFare}</div>
                    <button onclick="requestRideDirect('${username}', '${estFare}', '${distKm.toFixed(1)}')" class="w-full mt-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2 rounded-xl text-xs transition shadow-md">
                        🛺 Request Ride
                    </button>
                </div>
            `;

            if (markers[socketId]) {
                markers[socketId].marker.setLngLat([lng, lat]);
                markers[socketId].popup.setHTML(popupHTML);
                markers[socketId].data = { ...rider, distKm, estFare };
            } else {
                const el = document.createElement('div');
                el.className = 'text-3xl cursor-pointer hover:scale-125 transition-transform filter drop-shadow-lg';
                el.innerHTML = '🛺';

                const popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupHTML);
                const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).setPopup(popup).addTo(map);

                markers[socketId] = { marker, popup, data: { ...rider, distKm, estFare } };
            }

            renderFilteredRiders();
        }

        function renderFilteredRiders() {
            const list = document.getElementById('riderList');
            const count = document.getElementById('activeCount');
            const keys = Object.keys(markers).filter(id => markers[id].data.distKm <= maxRadiusKm);

            count.innerText = `${keys.length} Nearby`;

            Object.keys(markers).forEach(id => {
                markers[id].marker.getElement().style.display = markers[id].data.distKm <= maxRadiusKm ? 'block' : 'none';
            });

            if (keys.length === 0) {
                list.innerHTML = `<div class="text-xs text-slate-400 text-center py-8">No active Pragya drivers found within ${maxRadiusKm}km.</div>`;
                return;
            }

            list.innerHTML = keys.map(id => {
                const r = markers[id].data;
                return `
                    <div class="bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 space-y-2 hover:border-emerald-500/50 transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-500/30">
                                    ${r.vehicleType || 'Bajaj RE'}
                                </span>
                                <h3 class="font-extrabold text-sm text-white mt-1">${r.fullName || r.username}</h3>
                            </div>
                            <span class="text-xs font-mono font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
                                ${r.plateNumber || 'N/A'}
                            </span>
                        </div>
                        <div class="text-xs space-y-1 text-slate-300">
                            <div class="flex justify-between">
                                <span>🎨 ${r.vehicleColor || 'Yellow'}</span>
                                <span class="text-emerald-400 font-bold">GH₵ ${r.estFare}</span>
                            </div>
                            <div>📞 Contact: <a href="tel:${r.contact}" class="text-sky-400 font-bold underline">${r.contact || 'N/A'}</a></div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="flyToRider(${r.lng}, ${r.lat})" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl text-xs border border-slate-700 transition">
                                📍 3D Focus
                            </button>
                            <button onclick="requestRideDirect('${r.username}', '${r.estFare}', '${r.distKm.toFixed(1)}')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2 rounded-xl text-xs transition shadow-md">
                                🛺 Request
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function flyToRider(lng, lat) {
            map.flyTo({ center: [lng, lat], zoom: 18, pitch: 65, bearing: 30, speed: 1.2 });
        }

        function requestRideDirect(riderName, fare, dist) {
            const payMethod = confirm(`🛺 Confirm Request to ${riderName}?\n\nDistance: ${dist} km\nFare: GH₵ ${fare}\n\nPress OK to send request.`);
            if (payMethod) {
                socket.emit('request-ride', {
                    targetRiderUsername: riderName,
                    passengerName: 'Passenger',
                    pickupLat: passengerPos.lat,
                    pickupLng: passengerPos.lng,
                    distanceKm: dist,
                    estimatedFare: fare
                });
                alert("⏱️ Ride request sent to driver! Waiting for response...");
            }
        }

        socket.on('ride-request-response', (res) => {
            if (res.status === 'accepted') {
                alert(`🎉 RIDE ACCEPTED!\n\nDriver: ${res.riderName}\nPlate: ${res.plateNumber}\nPhone: ${res.riderContact}\n\nDriver is heading to your position!`);
            } else {
                alert(`❌ Driver declined. Select another nearby driver.`);
            }
        });
    </script>
</body>
</html>
