<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spatial Passenger Portal | PragyaLink Global</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 400px; background-color: #020617; }
        .glass-panel { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
        .vehicle-marker-3d {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-3 flex justify-between items-center z-20 shadow-xl shrink-0">
        <div class="flex items-center space-x-3">
            <a href="/" class="text-xl sm:text-2xl font-black text-white tracking-wider">Pragya<span class="text-sky-400">3D 🛺</span></a>
            <span class="bg-sky-500/20 text-sky-300 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full border border-sky-500/30 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span> 3D Spatial Vector Mode
            </span>
        </div>
        
        <div class="flex items-center space-x-2">
            <button onclick="toggle3DView()" class="text-xs bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 font-bold px-3 py-1.5 rounded-lg transition">
                🏗️ Toggle 3D Tilt
            </button>
            <button onclick="toggleHistoryDrawer()" class="text-xs bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/40 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                📜 Receipts (<span id="receiptCount">0</span>)
            </button>
        </div>
    </header>

    <div class="flex-1 relative flex flex-col md:flex-row min-h-0 w-full">
        <div class="flex-1 relative h-full w-full">
            <div id="map"></div>
        </div>

        <aside class="w-full md:w-80 glass-panel border-t md:border-t-0 md:border-l border-slate-800 p-4 flex flex-col z-10 shadow-2xl shrink-0 space-y-4 max-h-[50vh] md:max-h-full overflow-y-auto">
            
            <div class="space-y-1.5">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">🌐 Global Tricycle Markets</label>
                <select id="marketSelector" onchange="jumpToGlobalMarket(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500 font-mono">
                    <option value="kumasi">🇬🇭 Kumasi, Ghana (Pragya)</option>
                    <option value="tamale">🇬🇭 Tamale, Ghana (Mahindra/Bajaj)</option>
                    <option value="lagos">🇳🇬 Lagos, Nigeria (Keke Napep)</option>
                    <option value="delhi">🇮🇳 New Delhi, India (Auto Rickshaw)</option>
                    <option value="bangkok">🇹🇭 Bangkok, Thailand (Tuk-Tuk)</option>
                </select>
            </div>

            <div class="bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                <label class="block text-xs font-bold text-slate-300">Your Phone Number (MoMo Enabled) *</label>
                <input type="tel" id="passengerPhoneInput" onchange="savePassengerPhone()" placeholder="e.g. 0244123456" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-sky-500">
                <p class="text-[10px] text-slate-400">Used for dispatch confirmation & digital receipts.</p>
            </div>

            <div id="rideStatusCard" class="bg-slate-900/90 p-4 rounded-2xl border border-sky-500/40 space-y-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs font-black text-sky-400">📍 Spatial Dispatch</span>
                    <span id="statusTag" class="text-[9px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400">Idle / Searching</span>
                </div>
                <div id="passengerActionArea" class="space-y-2 text-xs">
                    <p class="text-slate-400 italic text-[11px]">Select any active 🛺 vehicle model on the 3D map to initiate dispatch.</p>
                </div>
            </div>

            <div id="historySection" class="space-y-2 pt-2 border-t border-slate-800">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-sky-400 uppercase tracking-wider">📜 Ride Receipts</h3>
                    <button onclick="clearReceiptsHistory()" class="text-[9px] text-red-400 hover:underline">Clear History</button>
                </div>
                <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <p class="text-[11px] text-slate-500 italic text-center py-2">No completed trips logged yet.</p>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const socket = io();
        let activeRidersOnMap = {};
        let passengerPos = { lat: 6.6885, lng: -1.6244 };
        let selectedTargetRider = null;
        let is3DTilted = true;

        // Global Market Coordinates
        const markets = {
            kumasi: { lng: -1.6244, lat: 6.6885, zoom: 16.5, pitch: 60, bearing: -17.6 },
            tamale: { lng: -0.8393, lat: 9.4007, zoom: 16, pitch: 55, bearing: 10 },
            lagos: { lng: 3.3792, lat: 6.5244, zoom: 16, pitch: 60, bearing: 25 },
            delhi: { lng: 77.2090, lat: 28.6139, zoom: 16.5, pitch: 60, bearing: -10 },
            bangkok: { lng: 100.5018, lat: 13.7563, zoom: 16.5, pitch: 60, bearing: 45 }
        };

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [passengerPos.lng, passengerPos.lat],
            zoom: markets.kumasi.zoom,
            pitch: markets.kumasi.pitch,
            bearing: markets.kumasi.bearing,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl());

        // Add 3D Building Extrusions Layer
        map.on('style.load', () => {
            const layers = map.getStyle().layers;
            let labelLayerId;
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
                    labelLayerId = layers[i].id;
                    break;
                }
            }

            map.addLayer({
                'id': '3d-buildings',
                'source': 'openmaptiles',
                'source-layer': 'building',
                'type': 'fill-extrusion',
                'minzoom': 13,
                'paint': {
                    'fill-extrusion-color': '#1e293b',
                    'fill-extrusion-height': [
                        'interpolate', ['linear'], ['zoom'],
                        13, 0,
                        15.05, ['coalesce', ['get', 'render_height'], 10]
                    ],
                    'fill-extrusion-base': [
                        'interpolate', ['linear'], ['zoom'],
                        13, 0,
                        15.05, ['coalesce', ['get', 'render_min_height'], 0]
                    ],
                    'fill-extrusion-opacity': 0.85
                }
            }, labelLayerId);
        });

        function toggle3DView() {
            is3DTilted = !is3DTilted;
            map.easeTo({
                pitch: is3DTilted ? 60 : 0,
                bearing: is3DTilted ? -17.6 : 0,
                duration: 1000
            });
        }

        function jumpToGlobalMarket(marketKey) {
            const m = markets[marketKey];
            if (m) {
                map.flyTo({
                    center: [m.lng, m.lat],
                    zoom: m.zoom,
                    pitch: m.pitch,
                    bearing: m.bearing,
                    duration: 2500,
                    essential: true
                });
            }
        }

        // GPS Location Handling
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                passengerPos.lat = pos.coords.latitude;
                passengerPos.lng = pos.coords.longitude;
                map.flyTo({ center: [passengerPos.lng, passengerPos.lat], zoom: 16.5, pitch: 60 });

                new maplibregl.Marker({ color: '#38bdf8' })
                    .setLngLat([passengerPos.lng, passengerPos.lat])
                    .setPopup(new maplibregl.Popup().setHTML('<b>📍 Pickup Point</b>'))
                    .addTo(map);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('pragya_passenger_phone');
            if (savedPhone) document.getElementById('passengerPhoneInput').value = savedPhone;
            renderLocalRideHistory();
        });

        function savePassengerPhone() {
            const phone = document.getElementById('passengerPhoneInput').value.trim();
            if (phone) localStorage.setItem('pragya_passenger_phone', phone);
        }

        function toggleHistoryDrawer() {
            document.getElementById('historySection').scrollIntoView({ behavior: 'smooth' });
        }

        function renderLocalRideHistory() {
            const listEl = document.getElementById('historyList');
            const receipts = JSON.parse(localStorage.getItem('pragya_passenger_receipts') || '[]');
            document.getElementById('receiptCount').innerText = receipts.length;

            if (receipts.length === 0) {
                listEl.innerHTML = `<p class="text-[11px] text-slate-500 italic text-center py-2">No completed trips logged yet.</p>`;
                return;
            }

            listEl.innerHTML = '';
            receipts.forEach(ride => {
                const item = document.createElement('div');
                item.className = 'bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-1 text-xs';
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-white">🛺 ${ride.riderName || 'Pragya Driver'}</span>
                        <span class="text-emerald-400 font-mono font-black text-sm">GH₵ ${parseFloat(ride.fareGhs).toFixed(2)}</span>
                    </div>
                    <div class="text-[10px] text-slate-400 flex justify-between font-mono">
                        <span>Plate: <strong class="text-amber-400">${ride.plateNumber || 'N/A'}</strong></span>
                        <span>${new Date(ride.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function clearReceiptsHistory() {
            if (confirm("Clear all locally saved ride receipts?")) {
                localStorage.removeItem('pragya_passenger_receipts');
                renderLocalRideHistory();
            }
        }

        // WebSockets Telemetry
        socket.on('current-riders', (riders) => {
            const activeList = Array.isArray(riders) ? riders : (riders.activeDrivers || []);
            activeList.forEach(updateRiderMarker);
        });

        socket.on('rider-location-updated', (rider) => {
            updateRiderMarker(rider);
        });

        function updateRiderMarker(rider) {
            if (!rider.lat || !rider.lng) return;

            if (activeRidersOnMap[rider.socketId]) {
                activeRidersOnMap[rider.socketId].setLngLat([rider.lng, rider.lat]);
            } else {
                const el = document.createElement('div');
                el.className = 'vehicle-marker-3d text-4xl cursor-pointer hover:scale-125 transition transform';
                el.innerText = '🛺';
                el.onclick = () => selectDriverForBooking(rider);

                activeRidersOnMap[rider.socketId] = new maplibregl.Marker({ element: el })
                    .setLngLat([rider.lng, rider.lat])
                    .setPopup(new maplibregl.Popup().setHTML(`
                        <b style="color:#10b981;">🛺 ${rider.fullName}</b><br>
                        <span style="font-family:monospace;">Plate: ${rider.plateNumber}</span><br>
                        <a href="tel:${rider.contact}" style="color:#38bdf8; font-weight:bold;">📞 Call: ${rider.contact}</a>
                    `))
                    .addTo(map);
            }
        }

        function selectDriverForBooking(rider) {
            selectedTargetRider = rider;
            document.getElementById('statusTag').innerText = "Driver Selected";
            document.getElementById('statusTag').className = "text-[9px] font-bold px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30";

            document.getElementById('passengerActionArea').innerHTML = `
                <div class="space-y-2">
                    <div class="flex justify-between items-center font-bold text-white">
                        <span>${rider.fullName}</span>
                        <span class="text-amber-400 font-mono text-[11px]">${rider.plateNumber}</span>
                    </div>
                    <a href="tel:${rider.contact}" class="w-full bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 rounded-xl py-1.5 text-xs font-bold flex items-center justify-center gap-1 transition">
                        📞 Call Driver: ${rider.contact}
                    </a>
                    <button onclick="sendRideDispatch()" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-black py-2.5 rounded-xl transition shadow-lg text-xs">
                        🚀 Request Dispatch
                    </button>
                </div>
            `;
        }

        function sendRideDispatch() {
            const phone = document.getElementById('passengerPhoneInput').value.trim();
            if (!phone) {
                alert("⚠️ Please enter your phone number first!");
                return;
            }
            savePassengerPhone();

            socket.emit('request-ride', {
                targetRiderUsername: selectedTargetRider.username,
                passengerPhone: phone,
                pickupLat: passengerPos.lat,
                pickupLng: passengerPos.lng
            });

            document.getElementById('statusTag').innerText = "Dispatch Sent";
            document.getElementById('passengerActionArea').innerHTML = `
                <div class="space-y-1">
                    <p class="text-amber-400 font-bold">Waiting for ${selectedTargetRider.fullName} to accept...</p>
                    <p class="text-[10px] text-slate-400 font-mono">Contact: ${selectedTargetRider.contact}</p>
                </div>
            `;
        }

        socket.on('ride-request-response', (res) => {
            if (res.status === 'accepted') {
                document.getElementById('statusTag').innerText = "Driver En Route";
                document.getElementById('statusTag').className = "text-[9px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";

                document.getElementById('passengerActionArea').innerHTML = `
                    <div class="space-y-2 bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/30">
                        <p class="text-emerald-400 font-bold">🎉 Driver Accepted!</p>
                        <p class="text-xs text-white">Driver: <strong>${res.riderName}</strong> (${res.plateNumber})</p>
                        <a href="tel:${res.riderContact}" class="text-sky-400 underline font-mono text-xs font-bold">📞 Call: ${res.riderContact}</a>
                    </div>
                `;
            }
        });

        socket.on('passenger-trip-ended', (summary) => {
            document.getElementById('statusTag').innerText = "Trip Completed";
            document.getElementById('statusTag').className = "text-[9px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";

            const newReceipt = {
                tripId: summary.tripRecord ? summary.tripRecord.tripId : 'TRIP-' + Date.now(),
                riderName: summary.tripRecord ? summary.tripRecord.riderName : (selectedTargetRider ? selectedTargetRider.fullName : 'Pragya Driver'),
                plateNumber: summary.tripRecord ? summary.tripRecord.plateNumber : (selectedTargetRider ? selectedTargetRider.plateNumber : 'N/A'),
                fareGhs: summary.fareGhs || 15.00,
                timestamp: new Date().toISOString()
            };

            let localHistory = JSON.parse(localStorage.getItem('pragya_passenger_receipts') || '[]');
            localHistory.unshift(newReceipt);
            localStorage.setItem('pragya_passenger_receipts', JSON.stringify(localHistory));

            document.getElementById('passengerActionArea').innerHTML = `
                <div class="space-y-2 bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/30">
                    <p class="text-emerald-400 font-bold">🏁 Trip Arrived & Completed!</p>
                    <p class="text-xs text-slate-200">Total Fare: <strong class="text-emerald-400 font-mono text-sm">GH₵ ${parseFloat(summary.fareGhs).toFixed(2)}</strong></p>
                    <p class="text-[10px] text-slate-400">Receipt saved automatically to history.</p>
                </div>
            `;

            renderLocalRideHistory();
        });
    </script>
</body>
</html>
