<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Manager Ledger & Telemetry | PragyaLink</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 400px; background-color: #020617; }
        .glass-panel { background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-3 flex justify-between items-center z-20 shadow-xl shrink-0">
        <div class="flex items-center space-x-3">
            <a href="/" class="text-xl sm:text-2xl font-black text-white tracking-wider">Pragya<span class="text-sky-400">Fleet 🏢</span></a>
            <span class="bg-sky-500/10 text-sky-400 text-[10px] sm:text-xs font-mono font-bold px-2.5 py-1 rounded-full border border-sky-500/20">
                Code: <span id="dispFleetCode">KUMASI_FLEET_01</span>
            </span>
        </div>

        <div class="flex items-center space-x-3 text-xs font-mono">
            <div class="bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                Online Vehicles: <strong id="cntOnlineVehicles" class="text-emerald-400">0</strong>
            </div>
            <div class="bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                Alerts / Overdue: <strong id="cntMaintenanceAlerts" class="text-red-400">0</strong>
            </div>
        </div>
    </header>

    <div class="flex-1 relative flex flex-col md:flex-row min-h-0 w-full">
        <div class="flex-1 relative h-full w-full">
            <div id="map"></div>
        </div>

        <aside class="w-full md:w-96 glass-panel border-t md:border-t-0 md:border-l border-slate-800 p-4 flex flex-col z-10 shadow-2xl shrink-0 space-y-4 max-h-[50vh] md:max-h-full overflow-y-auto">
            
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 class="text-sm font-black text-white uppercase tracking-wider">🛺 Fleet Telemetry & Service Ledger</h2>
                <span class="text-[10px] text-slate-400 font-mono">Live Sync</span>
            </div>

            <div id="fleetVehicleList" class="space-y-3">
                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-center text-xs text-slate-500 italic">
                    Waiting for linked fleet tricycles to come online...
                </div>
            </div>
        </aside>
    </div>

    <script>
        const socket = io();
        const activeFleetCode = "KUMASI_FLEET_01"; // Default manager code
        const fleetVehicles = {}; // Map of active vehicles
        const vehicleMarkers = {};

        // 3D Map Setup
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [-1.6244, 6.6885], // Kumasi
            zoom: 14,
            pitch: 45
        });

        map.addControl(new maplibregl.NavigationControl());

        // Listen for Driver Location & Engine Telemetry Updates
        socket.on('rider-location-updated', (data) => {
            // Filter telemetry for vehicles linked to this fleet code or operating in fleet mode
            if (data.fleetOwnerCode === activeFleetCode || data.operatingMode === 'FLEET') {
                const plate = data.plateNumber || 'UNKNOWN';
                
                fleetVehicles[plate] = {
                    ...data,
                    lastSeen: new Date()
                };

                updateFleetMapMarker(plate, data);
                renderFleetList();
            }
        });

        function updateFleetMapMarker(plate, data) {
            const isOverdue = data.engineHealth && data.engineHealth.serviceOverdue;
            const markerColor = isOverdue ? '#ef4444' : '#38bdf8'; // Red if overdue, Sky Blue if healthy

            if (vehicleMarkers[plate]) {
                vehicleMarkers[plate].setLngLat([data.lng, data.lat]);
            } else {
                vehicleMarkers[plate] = new maplibregl.Marker({ color: markerColor })
                    .setLngLat([data.lng, data.lat])
                    .setPopup(new maplibregl.Popup().setHTML(`
                        <div class="font-sans text-xs p-1">
                            <b>🛺 ${plate}</b><br/>
                            Driver: ${data.username}<br/>
                            Odometer: ${data.engineHealth ? data.engineHealth.odometerKm : 0} km
                        </div>
                    `))
                    .addTo(map);
            }
        }

        function renderFleetList() {
            const container = document.getElementById('fleetVehicleList');
            const plates = Object.keys(fleetVehicles);

            if (plates.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-center text-xs text-slate-500 italic">
                        Waiting for linked fleet tricycles to come online...
                    </div>
                `;
                return;
            }

            let onlineCount = plates.length;
            let overdueCount = 0;
            let html = '';

            plates.forEach(plate => {
                const v = fleetVehicles[plate];
                const eng = v.engineHealth || { odometerKm: '0.0', distSinceServiceKm: '0.0', serviceOverdue: false, vehicleStatus: 'HEALTHY' };
                
                if (eng.serviceOverdue) overdueCount++;

                const statusBadgeHtml = eng.serviceOverdue ?
                    `<span class="bg-red-500/20 text-red-400 border border-red-500/30 text-[9px] font-bold px-2 py-0.5 rounded animate-pulse">⚠️ Service Overdue</span>` :
                    `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[9px] font-bold px-2 py-0.5 rounded">🟢 Healthy</span>`;

                const borderStyle = eng.serviceOverdue ? 'border-red-500/50 bg-red-950/20' : 'border-slate-800 bg-slate-900/90';

                html += `
                    <div class="p-3.5 rounded-2xl border ${borderStyle} space-y-2.5 transition">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="text-xs font-black text-amber-400 font-mono">${plate}</span>
                                <span class="text-[11px] text-slate-300 ml-2 font-bold">${v.username}</span>
                            </div>
                            ${statusBadgeHtml}
                        </div>

                        <div class="grid grid-cols-2 gap-2 text-[10px] font-mono bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <div>Odometer: <strong class="text-white">${eng.odometerKm} km</strong></div>
                            <div>Interval Driven: <strong class="${eng.serviceOverdue ? 'text-red-400' : 'text-sky-400'}">${eng.distSinceServiceKm} / 1,500 km</strong></div>
                        </div>

                        ${eng.serviceOverdue ? `
                            <div class="text-[10px] bg-red-500/10 border border-red-500/30 text-red-300 p-2 rounded-lg font-bold">
                                🔧 Maintenance Alert: Vehicle reached 1,500 km service limit. Contact driver to perform oil change.
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cntOnlineVehicles').innerText = onlineCount;
            document.getElementById('cntMaintenanceAlerts').innerText = overdueCount;
        }
    </script>
</body>
</html>
<script>
    // Appends Fleet Distribution Percentage Cards to the Fleet Dashboard Sidebar
    function injectFleetAnalyticsCards() {
        const sidebar = document.querySelector('aside');
        if (!sidebar) return;

        const analyticsCardHtml = `
            <div id="fleetAnalyticsPanel" class="bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 space-y-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs font-black text-white uppercase tracking-wider">📊 Fleet Status Breakdown</span>
                    <span class="text-[9px] font-mono text-sky-400 bg-sky-500/10 border border-sky-500/20 px-2 py-0.5 rounded">200 Fleet Scale</span>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button onclick="openFilteredFleetLedger('ONLINE')" class="p-2 bg-slate-950 hover:bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-center transition group">
                        <div id="pctOnlineVal" class="text-sm font-black text-emerald-400 font-mono">0%</div>
                        <div class="text-[9px] text-slate-400 group-hover:text-emerald-300">🟢 Online</div>
                        <div id="cntOnlineDetail" class="text-[8px] text-slate-500 font-mono">(0/200)</div>
                    </button>

                    <button onclick="openFilteredFleetLedger('OVERDUE')" class="p-2 bg-slate-950 hover:bg-red-500/10 border border-red-500/30 rounded-xl text-center transition group">
                        <div id="pctOverdueVal" class="text-sm font-black text-red-400 font-mono">0%</div>
                        <div class="text-[9px] text-slate-400 group-hover:text-red-300">⚠️ Service</div>
                        <div id="cntOverdueDetail" class="text-[8px] text-slate-500 font-mono">(0/200)</div>
                    </button>

                    <button onclick="openFilteredFleetLedger('OFFLINE')" class="p-2 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl text-center transition group">
                        <div id="pctOfflineVal" class="text-sm font-black text-slate-400 font-mono">100%</div>
                        <div class="text-[9px] text-slate-400 group-hover:text-slate-200">⚪ Offline</div>
                        <div id="cntOfflineDetail" class="text-[8px] text-slate-500 font-mono">(200/200)</div>
                    </button>
                </div>
                
                <p class="text-[9px] text-slate-500 italic text-center">💡 Click any metric card above to inspect the matching vehicle list.</p>
            </div>
        `;

        sidebar.insertAdjacentHTML('afterbegin', analyticsCardHtml);
    }

    // Calculates percentages across all 200 registered vehicles in real time
    function recalculateFleetAnalytics() {
        const totalRegisteredVehicles = 200; // Total registered vehicles in fleet ledger
        const plates = Object.keys(fleetVehicles);

        let onlineCount = 0;
        let overdueCount = 0;

        plates.forEach(plate => {
            const v = fleetVehicles[plate];
            if (v.isOnline) onlineCount++;
            if (v.engineHealth && v.engineHealth.serviceOverdue) overdueCount++;
        });

        const offlineCount = Math.max(0, totalRegisteredVehicles - onlineCount);

        const pctOnline = Math.round((onlineCount / totalRegisteredVehicles) * 100);
        const pctOverdue = Math.round((overdueCount / totalRegisteredVehicles) * 100);
        const pctOffline = Math.round((offlineCount / totalRegisteredVehicles) * 100);

        // Update DOM Cards
        const elOnline = document.getElementById('pctOnlineVal');
        const elOverdue = document.getElementById('pctOverdueVal');
        const elOffline = document.getElementById('pctOfflineVal');

        if (elOnline) {
            elOnline.innerText = `${pctOnline}%`;
            document.getElementById('cntOnlineDetail').innerText = `(${onlineCount}/${totalRegisteredVehicles})`;
        }

        if (elOverdue) {
            elOverdue.innerText = `${pctOverdue}%`;
            document.getElementById('cntOverdueDetail').innerText = `(${overdueCount}/${totalRegisteredVehicles})`;
        }

        if (elOffline) {
            elOffline.innerText = `${pctOffline}%`;
            document.getElementById('cntOfflineDetail').innerText = `(${offlineCount}/${totalRegisteredVehicles})`;
        }
    }

    // Modal Trigger function connected directly to metric card clicks
    function openFilteredFleetLedger(category) {
        setFilterCategory(category);
        openFleetMasterLedger();
    }

    // Automatically hooks into incoming socket updates
    const origRenderFleetList = window.renderFleetList;
    window.renderFleetList = function() {
        if (origRenderFleetList) origRenderFleetList();
        recalculateFleetAnalytics();
    };

    window.addEventListener('DOMContentLoaded', () => {
        injectFleetAnalyticsCards();
        recalculateFleetAnalytics();
    });
</script>
<script>
    socket.on('connect', () => {
        console.log("Connected to server socket. Joining fleet room...");
        socket.emit('join-fleet-room', activeFleetCode);
    });

    // Backup trigger in case socket is already connected when script loads
    if (socket.connected) {
        socket.emit('join-fleet-room', activeFleetCode);
    }
</script>
