<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Owner Portal | PragyaLink Ghana</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 400px; background-color: #0f172a; }
        .glass-panel { background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

    <div id="addVehicleModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-md w-full p-6 rounded-3xl border border-amber-500/30 shadow-2xl space-y-4">
            <div class="flex items-center space-x-3 border-b border-slate-800 pb-3">
                <span class="text-3xl">🛺</span>
                <div>
                    <h2 class="text-xl font-black text-white">Register Fleet Vehicle</h2>
                    <p class="text-xs text-slate-400">Add asset for Work-and-Pay tracking</p>
                </div>
            </div>

            <form onsubmit="registerFleetVehicle(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Plate Number *</label>
                    <input type="text" id="regPlate" required placeholder="e.g. M-24-AS" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-mono uppercase">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Chassis / VIN Serial *</label>
                    <input type="text" id="regVin" required placeholder="e.g. MD2A25AY4MW123456" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-mono uppercase">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Vehicle Model</label>
                        <select id="regModel" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                            <option value="Bajaj RE">Bajaj RE</option>
                            <option value="TVS King">TVS King</option>
                            <option value="Mahindra Alfa">Mahindra Alfa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Daily Target (GH₵) *</label>
                        <input type="number" id="regTarget" required placeholder="120" value="120" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-mono">
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddVehicleModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">
                        Cancel
                    </button>
                    <button type="submit" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs transition shadow-lg">
                        ➕ Save Vehicle
                    </button>
                </div>
            </form>
        </div>
    </div>

    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-3 flex justify-between items-center z-20 shadow-xl shrink-0">
        <div class="flex items-center space-x-3">
            <a href="/" class="text-xl sm:text-2xl font-black text-white tracking-wider">Pragya<span class="text-amber-400">Fleet 📊</span></a>
            <span class="bg-amber-500/20 text-amber-300 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full border border-amber-500/30">
                Work-and-Pay Control Center
            </span>
        </div>
        
        <div class="flex items-center space-x-2">
            <button onclick="openAddVehicleModal()" class="text-xs bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                ➕ Add Vehicle
            </button>
            <label class="text-xs bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1 cursor-pointer">
                📥 Bulk CSV Import
                <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleBulkCsvUpload(event)">
            </label>
            <a href="/rider" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition">
                Driver Console
            </a>
        </div>
    </header>

    <div class="flex-1 relative flex flex-col md:flex-row min-h-0 w-full">
        <div class="flex-1 relative h-full w-full">
            <div id="map"></div>
        </div>

        <aside class="w-full md:w-96 glass-panel border-t md:border-t-0 md:border-l border-slate-800 p-4 flex flex-col z-10 shadow-2xl shrink-0 space-y-4 max-h-[50vh] md:max-h-full overflow-y-auto">
            <div class="border-b border-slate-800 pb-3">
                <h2 class="text-base font-black text-white">Fleet Summary</h2>
                <p class="text-[10px] text-slate-400">Real-time driver activity and lease target progress</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 uppercase font-bold">Active Fleet</span>
                    <div id="activeCount" class="text-xl font-black text-emerald-400 font-mono">0</div>
                </div>
                <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-800">
                    <span class="text-[10px] text-slate-400 uppercase font-bold">Total Fleet Distance</span>
                    <div id="fleetDistance" class="text-xl font-black text-amber-400 font-mono">0.0 km</div>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Live Vehicles</h3>
                <div id="fleetList" class="space-y-2">
                    <div class="text-xs text-slate-500 italic p-3 text-center border border-dashed border-slate-800 rounded-xl">
                        Waiting for active drivers on the network...
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const socket = io();
        const fleetMarkers = {};

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [-1.6244, 6.6885],
            zoom: 13,
            pitch: 45
        });

        map.addControl(new maplibregl.NavigationControl());

        function openAddVehicleModal() { document.getElementById('addVehicleModal').classList.remove('hidden'); }
        function closeAddVehicleModal() { document.getElementById('addVehicleModal').classList.add('hidden'); }

        function registerFleetVehicle(e) {
            e.preventDefault();
            const vehicleData = {
                plateNumber: document.getElementById('regPlate').value.toUpperCase(),
                vin: document.getElementById('regVin').value.toUpperCase(),
                model: document.getElementById('regModel').value,
                dailyTargetGhs: parseFloat(document.getElementById('regTarget').value),
                assignedDriverPhone: document.getElementById('regDriverPhone').value
            };
            socket.emit('owner-register-vehicle', vehicleData);
            closeAddVehicleModal();
        }

        function handleBulkCsvUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                let count = 0;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const [plateNumber, vin, model, dailyTargetGhs] = line.split(',');
                    if (plateNumber) {
                        socket.emit('owner-register-vehicle', {
                            plateNumber: plateNumber.trim().toUpperCase(),
                            vin: vin ? vin.trim().toUpperCase() : 'N/A',
                            model: model ? model.trim() : 'Bajaj RE',
                            dailyTargetGhs: parseFloat(dailyTargetGhs) || 120
                        });
                        count++;
                    }
                }
                alert(`🎉 BULK IMPORT SUCCESS!\n\nRegistered ${count} vehicles into fleet passports.`);
            };
            reader.readAsText(file);
        }

        socket.on('current-riders', (riders) => { renderFleet(riders); });
        socket.on('rider-location-updated', (rider) => { updateSingleRiderMarker(rider); });

        function renderFleet(riders) {
            document.getElementById('activeCount').innerText = riders.length;
            const fleetListEl = document.getElementById('fleetList');

            if (riders.length === 0) {
                fleetListEl.innerHTML = `<div class="text-xs text-slate-500 italic p-3 text-center border border-dashed border-slate-800 rounded-xl">No active tricycles online right now.</div>`;
                return;
            }

            fleetListEl.innerHTML = '';
            let totalKm = 0;

            riders.forEach(rider => {
                updateSingleRiderMarker(rider);

                const currentKm = rider.passport ? rider.passport.currentServiceKm : 0;
                const lifetimeKm = rider.passport ? rider.passport.totalLifetimeKm : 0;
                const target = rider.passport ? (rider.passport.dailyLeaseTarget || 120) : 120;
                const earnings = rider.shiftEarnings || 0.00;
                totalKm += lifetimeKm;

                let statusBadge = `<span class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded text-[10px]">🟢 Idle</span>`;
                if (rider.status === 'EN_ROUTE') statusBadge = `<span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded text-[10px] animate-pulse">🟡 Pickup</span>`;
                if (rider.status === 'ON_TRIP') statusBadge = `<span class="bg-sky-500/20 text-sky-300 px-2 py-0.5 rounded text-[10px] animate-pulse">🔵 On Trip</span>`;

                const card = document.createElement('div');
                card.className = "bg-slate-900/80 p-3 rounded-2xl border border-slate-800 space-y-2 text-xs";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-extrabold text-white">${rider.fullName || 'Driver'}</span>
                        ${statusBadge}
                    </div>
                    <div class="text-[11px] text-slate-400 flex justify-between">
                        <span>Plate: <strong class="text-amber-400 font-mono">${rider.plateNumber}</strong></span>
                        <span>Shift Earnings: <strong class="text-emerald-400 font-mono">GH₵ ${earnings.toFixed(2)}</strong></span>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] text-slate-400 font-mono">
                            <span>Lease Target Progress:</span>
                            <span>GH₵ ${earnings.toFixed(0)} / GH₵ ${target}</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div class="bg-amber-400 h-full transition-all duration-500" style="width: ${Math.min(100, (earnings / target) * 100)}%;"></div>
                        </div>
                    </div>
                `;
                fleetListEl.appendChild(card);
            });

            document.getElementById('fleetDistance').innerText = `${totalKm.toFixed(1)} km`;
        }

        function updateSingleRiderMarker(rider) {
            if (!rider.lat || !rider.lng) return;

            if (fleetMarkers[rider.socketId]) {
                fleetMarkers[rider.socketId].setLngLat([rider.lng, rider.lat]);
            } else {
                const el = document.createElement('div');
                el.className = 'text-3xl filter drop-shadow-lg cursor-pointer animate-pulse';
                el.innerText = '🛺';

                fleetMarkers[rider.socketId] = new maplibregl.Marker({ element: el })
                    .setLngLat([rider.lng, rider.lat])
                    .setPopup(new maplibregl.Popup().setHTML(`<b>🛺 ${rider.fullName}</b><br>Plate: ${rider.plateNumber}`))
                    .addTo(map);
            }
        }
    </script>
</body>
</html>
