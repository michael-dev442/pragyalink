<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mechanic Dispatch & Live Guidance | PragyaLink</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ef4444">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
            background-color: #0f172a;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .maplibregl-popup-content {
            background: #0f172a !important;
            color: #f8fafc !important;
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { 
            border-top-color: #0f172a !important; 
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-3 flex justify-between items-center z-20 shadow-xl shrink-0">
        <div class="flex items-center space-x-2 sm:space-x-3">
            <a href="/" class="text-xl sm:text-2xl font-black text-white tracking-wider">Pragya<span class="text-red-500">SOS 🛠️</span></a>
            <span class="bg-red-500/20 text-red-300 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full border border-red-500/30 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> Live Workshop Dispatch
            </span>
        </div>
        
        <div class="flex items-center space-x-2">
            <button id="toggleWorkshopBtn" onclick="toggleWorkshopStatus()" class="text-xs bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-3 py-1.5 rounded-lg transition shadow-md">
                🟢 Workshop Active
            </button>
            <a href="/passenger" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3 py-1.5 rounded-lg transition border border-slate-700">
                Passenger View
            </a>
        </div>
    </header>

    <div class="flex-1 relative flex flex-col md:flex-row min-h-0 w-full">
        
        <div class="flex-1 relative h-full w-full">
            <div id="map"></div>
        </div>

        <aside class="w-full md:w-96 glass-panel border-t md:border-t-0 md:border-l border-slate-800 p-4 flex flex-col z-10 shadow-2xl max-h-[40vh] md:max-h-full overflow-y-auto shrink-0">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <div>
                    <h2 class="text-sm sm:text-base font-black text-white">Faulty Vehicles SOS</h2>
                    <p class="text-[10px] text-slate-400">Real-time Roadside Assistance Queue</p>
                </div>
                <span id="sosCount" class="bg-red-500/20 text-red-400 text-xs font-mono font-bold px-2.5 py-1 rounded-full border border-red-500/30">
                    0 Emergency
                </span>
            </div>

            <div id="sosList" class="space-y-3 flex-1 overflow-y-auto pr-1">
                <div id="emptyMsg" class="text-xs text-slate-400 text-center py-8">
                    No active breakdown SOS beacons reported. Monitoring network...
                </div>
            </div>
        </aside>
    </div>

    <script>
        const socket = io();
        const sosMarkers = {};
        let workshopPos = { lat: 6.6885, lng: -1.6244 }; // Default Kumasi center fallback
        let isOnline = true;

        // Initialize MapLibre with OpenFreeMap High-Detail 3D Vector Style (Unified with Passenger Engine)
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty', // Complete, unthrottled OpenStreetMap vectors
            center: [workshopPos.lng, workshopPos.lat],
            zoom: 16,
            minZoom: 1,
            maxZoom: 20,
            pitch: 50,
            bearing: 0,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

        // Load Event: Apply High-Contrast Text Labels & 3D Building Extrusions
        map.on('load', () => {
            map.resize();
            const style = map.getStyle();

            if (style && style.layers) {
                style.layers.forEach((layer) => {
                    if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
                        map.setLayoutProperty(layer.id, 'text-size', [
                            'interpolate', ['linear'], ['zoom'],
                            2, 10, 10, 13, 16, 16, 20, 22
                        ]);
                        map.setPaintProperty(layer.id, 'text-halo-color', '#000000');
                        map.setPaintProperty(layer.id, 'text-halo-width', 2.5);
                        map.setPaintProperty(layer.id, 'text-color', '#ffffff');
                    }
                });
            }

            // Global 3D Building Extrusions
            let firstSymbolId;
            if (style && style.layers) {
                for (const layer of style.layers) {
                    if (layer.type === 'symbol') {
                        firstSymbolId = layer.id;
                        break;
                    }
                }
            }

            if (!map.getLayer('3d-buildings')) {
                map.addLayer({
                    'id': '3d-buildings',
                    'source': 'openfreemap',
                    'source-layer': 'building',
                    'type': 'fill-extrusion',
                    'minzoom': 14,
                    'paint': {
                        'fill-extrusion-color': '#1e293b',
                        'fill-extrusion-height': [
                            'interpolate', ['linear'], ['zoom'],
                            14, 0, 15.05, ['get', 'render_height']
                        ],
                        'fill-extrusion-base': [
                            'interpolate', ['linear'], ['zoom'],
                            14, 0, 15.05, ['get', 'render_min_height']
                        ],
                        'fill-extrusion-opacity': 0.7
                    }
                }, firstSymbolId);
            }

            // Prepare Live Guidance Route GeoJSON Source
            map.addSource('guidance-route', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': []
                    }
                }
            });

            // Glowing Red Rescue Navigation Line Layer
            map.addLayer({
                'id': 'guidance-route-line',
                'type': 'line',
                'source': 'guidance-route',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#ef4444',
                    'line-width': 6,
                    'line-opacity': 0.9
                }
            });
        });

        window.addEventListener('resize', () => map.resize());

        // Auto-detect Workshop GPS Location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                workshopPos.lat = pos.coords.latitude;
                workshopPos.lng = pos.coords.longitude;
                
                map.flyTo({ center: [workshopPos.lng, workshopPos.lat], zoom: 16, pitch: 50 });

                // Workshop Location Marker
                const wEl = document.createElement('div');
                wEl.className = 'text-3xl filter drop-shadow-lg animate-bounce';
                wEl.innerHTML = '🛠️';
                new maplibregl.Marker({ element: wEl })
                    .setLngLat([workshopPos.lng, workshopPos.lat])
                    .addTo(map);

                // Register Workshop with Socket Server
                socket.emit('register-workshop', {
                    name: 'Central Pragya Workshop',
                    lat: workshopPos.lat,
                    lng: workshopPos.lng
                });
            });
        }

        // Spherical Haversine Distance Formula (in KM)
        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // Listen for Real-Time Breakdown SOS Beacons from Stranded Drivers
        socket.on('driver-sos-alert', (sosData) => {
            addOrUpdateSosBeacon(sosData);
        });

        socket.on('sos-resolved', (driverUsername) => {
            if (sosMarkers[driverUsername]) {
                sosMarkers[driverUsername].marker.remove();
                delete sosMarkers[driverUsername];
                renderSosQueue();
            }
        });

        function addOrUpdateSosBeacon(sosData) {
            const { username, fullName, contact, plateNumber, issue, lat, lng } = sosData;
            const distKm = calculateDistanceKm(workshopPos.lat, workshopPos.lng, lat, lng);

            const popupHTML = `
                <div class="space-y-1.5 text-xs">
                    <div class="flex justify-between items-center gap-2">
                        <span class="font-extrabold text-red-400 text-sm">🚨 FAULTY VEHICLE</span>
                        <span class="bg-red-500/20 text-red-300 font-mono font-bold text-[10px] px-2 py-0.5 rounded border border-red-500/30">
                            ${distKm < 1 ? Math.round(distKm * 1000) + 'm away' : distKm.toFixed(1) + 'km away'}
                        </span>
                    </div>
                    <div class="text-white font-bold text-sm">${fullName || username}</div>
                    <div class="text-amber-300 font-bold">Issue: ${issue || 'General Engine Failure'}</div>
                    <div class="text-slate-300">📞 <a href="tel:${contact}" class="underline text-sky-300 font-bold">${contact || 'N/A'}</a></div>
                    <div class="text-slate-400">Plate: <span class="text-amber-400 font-mono font-bold">${plateNumber || 'N/A'}</span></div>
                    <button onclick="streamLiveGuidance(${lat}, ${lng}, '${username}')" class="w-full mt-2 bg-red-500 hover:bg-red-400 text-slate-950 font-black py-2 rounded-xl text-xs transition shadow-md">
                        🗺️ Stream Live Guidance Route
                    </button>
                </div>
            `;

            if (sosMarkers[username]) {
                sosMarkers[username].marker.setLngLat([lng, lat]);
                sosMarkers[username].popup.setHTML(popupHTML);
                sosMarkers[username].data = { ...sosData, distKm };
            } else {
                const el = document.createElement('div');
                el.className = 'text-3xl cursor-pointer animate-ping filter drop-shadow-lg';
                el.innerHTML = '🚨';

                const popup = new maplibregl.Popup({ offset: 25 }).setHTML(popupHTML);
                const marker = new maplibregl.Marker({ element: el })
                    .setLngLat([lng, lat])
                    .setPopup(popup)
                    .addTo(map);

                sosMarkers[username] = { marker, popup, data: { ...sosData, distKm } };
            }

            renderSosQueue();
            
            // Audio Chime Alert for Mechanic
            const alertAudio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
            alertAudio.play().catch(() => {});
        }

        function renderSosQueue() {
            const list = document.getElementById('sosList');
            const count = document.getElementById('sosCount');
            const keys = Object.keys(sosMarkers);

            count.innerText = `${keys.length} Emergency`;

            if (keys.length === 0) {
                list.innerHTML = `<div class="text-xs text-slate-400 text-center py-8">No active breakdown SOS beacons reported. Monitoring network...</div>`;
                return;
            }

            list.innerHTML = keys.map(id => {
                const s = sosMarkers[id].data;
                const formattedDist = s.distKm < 1 ? `${Math.round(s.distKm * 1000)} meters away` : `${s.distKm.toFixed(1)} km away`;
                return `
                    <div class="bg-slate-900/90 p-3.5 rounded-2xl border border-red-900/40 space-y-2 hover:border-red-500/50 transition shadow-md">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-red-500/20 text-red-400 text-[10px] font-bold px-2 py-0.5 rounded border border-red-500/30">
                                    ${s.issue || 'Engine Breakdown'}
                                </span>
                                <h3 class="font-extrabold text-sm text-white mt-1">${s.fullName || s.username}</h3>
                            </div>
                            <span class="text-xs font-mono font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
                                ${s.plateNumber || 'N/A'}
                            </span>
                        </div>

                        <div class="text-xs space-y-1 text-slate-300">
                            <div class="flex justify-between">
                                <span>📍 Location: <strong class="text-white">${formattedDist}</strong></span>
                            </div>
                            <div>📞 Contact: <a href="tel:${s.contact}" class="text-sky-400 font-bold underline">${s.contact || 'N/A'}</a></div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="flyToTarget(${s.lng}, ${s.lat})" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl text-xs border border-slate-700 transition">
                                📍 3D Focus
                            </button>
                            <button onclick="streamLiveGuidance(${s.lat}, ${s.lng}, '${s.username}')" class="bg-red-500 hover:bg-red-400 text-slate-950 font-black py-2 rounded-xl text-xs transition shadow-md">
                                🗺️ Live Stream Route
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function flyToTarget(lng, lat) {
            map.flyTo({ center: [lng, lat], zoom: 18, pitch: 65, bearing: 30, speed: 1.2 });
        }

        // Live Stream Guidance Routing Engine (Draws exact route line on 3D map)
        async function streamLiveGuidance(targetLat, targetLng, username) {
            flyToTarget(targetLng, targetLat);

            try {
                // Fetch dynamic OSRM routing stream between Workshop and Faulty Vehicle
                const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${workshopPos.lng},${workshopPos.lat};${targetLng},${targetLat}?overview=full&geometries=geojson`);
                const data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    const routeCoordinates = data.routes[0].geometry.coordinates;

                    // Update Map GeoJSON source to render glowing red route line
                    map.getSource('guidance-route').setData({
                        'type': 'Feature',
                        'properties': {},
                        'geometry': {
                            'type': 'LineString',
                            'coordinates': routeCoordinates
                        }
                    });

                    const distKm = (data.routes[0].distance / 1000).toFixed(1);
                    const durationMin = Math.round(data.routes[0].duration / 60);

                    alert(`🗺️ LIVE STREAM GUIDANCE ACTIVE!\n\nDistance to Vehicle: ${distKm} km\nEst. Rescue Arrival: ~${durationMin} mins\n\nRed guidance vector line drawn on 3D map!`);
                }
            } catch (err) {
                // Fallback straight-line vector routing
                map.getSource('guidance-route').setData({
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': [
                            [workshopPos.lng, workshopPos.lat],
                            [targetLng, targetLat]
                        ]
                    }
                });
                alert("🗺️ Streaming direct vector route line to faulty vehicle location!");
            }
        }

        function toggleWorkshopStatus() {
            isOnline = !isOnline;
            const btn = document.getElementById('toggleWorkshopBtn');
            if (isOnline) {
                btn.className = "text-xs bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-3 py-1.5 rounded-lg transition shadow-md";
                btn.innerText = "🟢 Workshop Active";
            } else {
                btn.className = "text-xs bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-lg transition";
                btn.innerText = "🔴 Workshop Offline";
            }
        }
    </script>
</body>
</html>
