<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Console & Pragya AI | PragyaLink Global</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 400px; background-color: #020617; }
        .glass-panel { background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-3 flex justify-between items-center z-20 shadow-xl shrink-0">
        <div class="flex items-center space-x-3">
            <a href="/" class="text-xl sm:text-2xl font-black text-white tracking-wider">Pragya<span class="text-amber-400">Rider 🛺</span></a>
            <span id="shiftBadge" class="bg-slate-800 text-slate-400 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full border border-slate-700">
                Offline
            </span>
        </div>
        
        <div class="flex items-center space-x-2">
            <button id="voiceMicBtn" onclick="testVoiceAssistant()" class="text-xs bg-sky-500/20 text-sky-300 border border-sky-500/40 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition hover:bg-sky-500/30">
                <span class="w-2 h-2 rounded-full bg-sky-400"></span>
                <span>Test English Voice</span>
            </button>
            <a href="/passenger" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3 py-1.5 rounded-lg border border-slate-700 transition">
                Passenger Portal
            </a>
        </div>
    </header>

    <div class="flex-1 relative flex flex-col md:flex-row min-h-0 w-full">
        <div class="flex-1 relative h-full w-full">
            <div id="map"></div>
        </div>

        <aside class="w-full md:w-80 glass-panel border-t md:border-t-0 md:border-l border-slate-800 p-4 flex flex-col z-10 shadow-2xl shrink-0 space-y-4 max-h-[50vh] md:max-h-full overflow-y-auto">
            
            <div class="bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-bold text-slate-300">Driver & Fleet Profile</label>
                    <span class="text-[9px] font-mono text-amber-400">Fleet Passport Verified</span>
                </div>
                
                <div class="space-y-1.5">
                    <input type="text" id="driverUsername" placeholder="Driver Full Name (e.g. Kofi Mensah)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500 font-mono">
                    <input type="tel" id="driverContact" placeholder="Driver Phone (e.g. 0244123456)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500 font-mono">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="driverPlate" placeholder="Plate: M-24-AS" class="bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-amber-400 font-mono focus:outline-none focus:border-amber-500">
                        <input type="text" id="fleetOwnerCode" placeholder="Fleet Owner Code" class="bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-sky-400 font-mono focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <button id="shiftToggleBtn" onclick="toggleShiftStatus()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2 rounded-xl transition text-xs shadow-lg">
                    🟢 Go Online & Link Fleet
                </button>
            </div>

            <div id="tripStatusCard" class="bg-slate-900/90 p-4 rounded-2xl border border-amber-500/40 space-y-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs font-black text-amber-400">🎙️ Pragya Voice Console</span>
                    <span id="tripStatusTag" class="text-[9px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400">Idle / Offline</span>
                </div>
                <div id="tripActionArea" class="space-y-2 text-xs">
                    <p class="text-slate-400 italic text-[11px]">Go online to link fleet and activate hands-free navigation.</p>
                </div>
            </div>

            <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-[10px] space-y-1 font-mono">
                <div class="text-slate-500 font-bold uppercase tracking-wider">Voice Log</div>
                <div id="speechTranscript" class="text-sky-300 italic min-h-[20px]">Voice assistant standard English ready.</div>
            </div>
        </aside>
    </div>

    <script>
        const socket = io();
        let isOnline = false;
        let driverPos = { lat: 6.6885, lng: -1.6244 };
        let activePassenger = null;
        let activeRouteCoordinates = [];
        
        // Voice State
        let recognition = null;
        let milestoneAlerts = { m500: false, m200: false, m50: false };

        // Map Setup
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [driverPos.lng, driverPos.lat],
            zoom: 16.5,
            pitch: 60,
            bearing: -17.6
        });

        map.addControl(new maplibregl.NavigationControl());

        const driverMarker = new maplibregl.Marker({ color: '#f59e0b' })
            .setLngLat([driverPos.lng, driverPos.lat])
            .setPopup(new maplibregl.Popup().setHTML('<b>🛺 Your Tricycle</b>'))
            .addTo(map);

        // Location Engine
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                driverPos.lat = pos.coords.latitude;
                driverPos.lng = pos.coords.longitude;
                driverMarker.setLngLat([driverPos.lng, driverPos.lat]);

                if (isOnline) {
                    socket.emit('update-rider-location', {
                        username: document.getElementById('driverUsername').value.trim() || 'Driver',
                        plateNumber: document.getElementById('driverPlate').value.trim() || 'N/A',
                        fleetOwnerCode: document.getElementById('fleetOwnerCode').value.trim() || 'DEFAULT_FLEET',
                        lat: driverPos.lat,
                        lng: driverPos.lng
                    });

                    if (activePassenger) {
                        checkDistanceMilestonesAndClipTrail();
                    }
                }
            }, null, { enableHighAccuracy: true });
        }

        // ==========================================
        // 🎙️ STANDARD ENGLISH VOICE ASSISTANT ENGINE
        // ==========================================

        function speakPragyaText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop prior speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; // Standard English strictly
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function testVoiceAssistant() {
            speakPragyaText("Pragya AI assistant is active in standard English mode.");
        }

        function initPragyaVoiceAssistant() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.continuous = false; // Prevents endless looping!
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                document.getElementById('speechTranscript').innerText = `"${transcript}"`;

                if (transcript.includes("accept")) {
                    if (activePassenger) {
                        speakPragyaText("Dispatch accepted. Navigating to pickup.");
                        acceptRideDispatch();
                    }
                } else if (transcript.includes("call")) {
                    if (activePassenger) {
                        speakPragyaText(`Calling passenger at ${activePassenger.passengerPhone}`);
                        window.location.href = `tel:${activePassenger.passengerPhone}`;
                    }
                } else if (transcript.includes("end trip") || transcript.includes("arrived")) {
                    speakPragyaText("Ending trip and logging fare.");
                    endTripAndCalculateFare();
                }
            };

            recognition.onend = () => {
                if (isOnline) {
                    try { recognition.start(); } catch(e){}
                }
            };

            if (isOnline) {
                try { recognition.start(); } catch(e){}
            }
        }

        // ==========================================
        // ✂️ TRAIL VANISHING & DISTANCE MILESTONES
        // ==========================================

        function checkDistanceMilestonesAndClipTrail() {
            if (!activePassenger) return;

            const distMeters = calculateHaversineDistance(
                driverPos.lat, driverPos.lng,
                activePassenger.pickupLat, activePassenger.pickupLng
            );

            if (distMeters <= 500 && !milestoneAlerts.m500) {
                milestoneAlerts.m500 = true;
                speakPragyaText("In 500 meters, prepare to arrive at pickup.");
            } else if (distMeters <= 200 && !milestoneAlerts.m200) {
                milestoneAlerts.m200 = true;
                speakPragyaText("In 200 meters, slow down. Pickup point is ahead.");
            } else if (distMeters <= 50 && !milestoneAlerts.m50) {
                milestoneAlerts.m50 = true;
                speakPragyaText("You have arrived at the passenger pickup location.");
            }

            // Clip Trail Line
            if (activeRouteCoordinates.length > 0) {
                activeRouteCoordinates = activeRouteCoordinates.filter(coord => {
                    const distToPoint = calculateHaversineDistance(driverPos.lat, driverPos.lng, coord[1], coord[0]);
                    return distToPoint < distMeters + 15;
                });

                if (map.getSource('route-line')) {
                    map.getSource('route-line').setData({
                        'type': 'Feature',
                        'geometry': { 'type': 'LineString', 'coordinates': activeRouteCoordinates }
                    });
                }
            }
        }

        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // ==========================================
        // 🛺 SHIFT MANAGEMENT & FLEET LINKING
        // ==========================================

        function toggleShiftStatus() {
            const username = document.getElementById('driverUsername').value.trim();
            const contact = document.getElementById('driverContact').value.trim();
            const plateNumber = document.getElementById('driverPlate').value.trim();
            const fleetOwnerCode = document.getElementById('fleetOwnerCode').value.trim() || 'INDEPENDENT';

            if (!username || !contact || !plateNumber) {
                alert("⚠️ Please enter your Full Name, Phone Number, and Plate Number!");
                return;
            }

            isOnline = !isOnline;
            const btn = document.getElementById('shiftToggleBtn');
            const badge = document.getElementById('shiftBadge');

            if (isOnline) {
                btn.innerText = "🔴 Go Offline / End Shift";
                btn.className = "w-full bg-red-500 hover:bg-red-400 text-white font-black py-2 rounded-xl transition text-xs shadow-lg";
                badge.innerText = "Online";
                badge.className = "bg-emerald-500/20 text-emerald-300 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-500/30";

                socket.emit('rider-online', {
                    username: username,
                    fullName: username,
                    contact: contact,
                    plateNumber: plateNumber,
                    fleetOwnerCode: fleetOwnerCode,
                    lat: driverPos.lat,
                    lng: driverPos.lng
                });

                speakPragyaText(`Welcome online, Driver ${username}. Vehicle linked to Fleet ${fleetOwnerCode}.`);
                initPragyaVoiceAssistant();
            } else {
                btn.innerText = "🟢 Go Online & Link Fleet";
                btn.className = "w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2 rounded-xl transition text-xs shadow-lg";
                badge.innerText = "Offline";
                badge.className = "bg-slate-800 text-slate-400 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-full border border-slate-700";

                socket.emit('rider-offline', { username: username });
                if (recognition) recognition.stop();
            }
        }

        // Dispatch Sockets
        socket.on('incoming-ride-request', (req) => {
            activePassenger = req;
            milestoneAlerts = { m500: false, m200: false, m50: false };

            speakPragyaText(`Dispatch alert from passenger phone ending in ${req.passengerPhone.slice(-4)}.`);

            document.getElementById('tripStatusTag').innerText = "Dispatch Alert";
            document.getElementById('tripStatusTag').className = "text-[9px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse";

            document.getElementById('tripActionArea').innerHTML = `
                <div class="space-y-2 bg-amber-500/10 p-3 rounded-xl border border-amber-500/30">
                    <p class="text-amber-400 font-bold text-xs">🚀 Dispatch Request Received</p>
                    <p class="text-[11px] text-white">Passenger Phone: <strong class="font-mono">${req.passengerPhone}</strong></p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="acceptRideDispatch()" class="bg-emerald-500 text-slate-950 font-bold py-1.5 rounded-lg text-xs">Accept Ride</button>
                        <a href="tel:${req.passengerPhone}" class="bg-sky-500/20 text-sky-300 border border-sky-500/40 font-bold py-1.5 rounded-lg text-xs text-center">📞 Call</a>
                    </div>
                </div>
            `;

            // Draw Route Polyline
            activeRouteCoordinates = [
                [driverPos.lng, driverPos.lat],
                [req.pickupLng, req.pickupLat]
            ];

            if (map.getSource('route-line')) {
                map.getSource('route-line').setData({
                    'type': 'Feature',
                    'geometry': { 'type': 'LineString', 'coordinates': activeRouteCoordinates }
                });
            } else {
                map.addSource('route-line', {
                    'type': 'geojson',
                    'data': {
                        'type': 'Feature',
                        'geometry': { 'type': 'LineString', 'coordinates': activeRouteCoordinates }
                    }
                });
                map.addLayer({
                    'id': 'route-line-layer',
                    'type': 'line',
                    'source': 'route-line',
                    'paint': { 'line-color': '#38bdf8', 'line-width': 6, 'line-opacity': 0.8 }
                });
            }
        });

        function acceptRideDispatch() {
            socket.emit('respond-ride-request', {
                passengerSocketId: activePassenger.passengerSocketId,
                status: 'accepted',
                riderName: document.getElementById('driverUsername').value.trim() || 'Driver',
                plateNumber: document.getElementById('driverPlate').value.trim() || 'N/A',
                riderContact: document.getElementById('driverContact').value.trim() || 'N/A'
            });

            document.getElementById('tripStatusTag').innerText = "En Route to Pickup";
            document.getElementById('tripStatusTag').className = "text-[9px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";

            document.getElementById('tripActionArea').innerHTML = `
                <div class="space-y-2 bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/30">
                    <p class="text-emerald-400 font-bold">En Route to Pickup</p>
                    <a href="tel:${activePassenger.passengerPhone}" class="text-sky-400 underline font-mono text-xs font-bold block">📞 Call Passenger: ${activePassenger.passengerPhone}</a>
                    <button onclick="endTripAndCalculateFare()" class="w-full bg-red-500 hover:bg-red-400 text-white font-black py-2 rounded-xl text-xs transition">
                        🏁 Arrived & End Trip
                    </button>
                </div>
            `;
        }

        function endTripAndCalculateFare() {
            const fareGhs = 15.00;
            
            socket.emit('end-trip', {
                passengerSocketId: activePassenger ? activePassenger.passengerSocketId : null,
                fareGhs: fareGhs
            });

            speakPragyaText(`Trip completed. Fare recorded as 15 Ghana Cedis.`);

            document.getElementById('tripStatusTag').innerText = "Idle / Waiting";
            document.getElementById('tripStatusTag').className = "text-[9px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400";
            document.getElementById('tripActionArea').innerHTML = `<p class="text-slate-400 italic text-[11px]">Trip completed! Fleet ledger updated.</p>`;

            if (map.getSource('route-line')) {
                map.getSource('route-line').setData({
                    'type': 'Feature',
                    'geometry': { 'type': 'LineString', 'coordinates': [] }
                });
            }
            activePassenger = null;
        }
    </script>
</body>
</html>
